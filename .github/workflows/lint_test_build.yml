name: Lint, Test, and Build

permissions:
  contents: read

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    paths:
      - "Bouncer/**"
      - "scripts/**"
      - ".github/workflows/lint_test_build.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Bouncer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test

  operator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/test-macos-ollama-setup.mjs scripts/test-prepare-native-model.mjs

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Bouncer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Bouncer/package-lock.json
      - run: npm ci
      - run: node build.js
