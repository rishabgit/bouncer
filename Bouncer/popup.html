<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container" id="mainContainer">
    <header>
      <h1>Bouncer</h1>
      <button id="modalCloseBtn" class="modal-close-btn" aria-label="Close Bouncer settings">&times;</button>
    </header>
    <section id="localModelSection" class="local-model-section" aria-labelledby="localModelTitle">
      <h2 id="localModelTitle" class="local-model-title">Llama.app on this Mac</h2>
      <p id="localModelResourceHint" class="hint local-model-resource-hint">Uses Llama.app to process posts and filter phrases on your device.</p>
      <div class="local-model-header">
        <h3 class="automatic-filtering-title">Automatic filtering</h3>
        <span id="localModelStatusBadge" class="status-badge" aria-live="polite">Checking…</span>
      </div>
      <p id="localModelStatusText" class="hint model-state" aria-live="polite">Checking Llama.app…</p>
      <div class="local-model-actions">
        <button id="checkLocalModelStatus" class="local-model-check-btn">Check status</button>
      </div>
      <details id="localModelSetupHelp" class="local-model-setup-help" hidden>
        <summary>Setup details</summary>
        <p id="localModelSetupHelpText" class="hint"></p>
        <pre id="localModelSettings" hidden><code id="localModelSettingsText"></code></pre>
      </details>
      <p class="setup-link"><a id="localSetupLink" href="setup.html" target="_blank" rel="noopener">Open setup help</a></p>
      <p id="localModelActionError" class="local-model-action-error" role="alert" hidden></p>
      <p class="hint local-model-no-image-warning"><strong>Text only.</strong> Images and videos are judged by their written text.</p>
    </section>
    <section>
      <div class="filter-replies-toggle"><label class="checkbox-label"><input type="checkbox" id="enableFilterReplies" checked><span>Filter replies in conversations</span></label></div>
      <p id="filterRepliesError" class="local-model-action-error" role="alert" hidden></p>
    </section>
  </div>
  <script src="dist/popup.js" type="module"></script>
</body>
</html>
