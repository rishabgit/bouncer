<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncer Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Main settings -->
  <div class="container" id="mainContainer">
    <header>
      <h1>Bouncer</h1>
      <button id="modalCloseBtn" class="modal-close-btn">&times;</button>
    </header>

    <section id="localModelSection" class="local-model-section" aria-labelledby="localModelTitle">
      <div class="local-model-header">
        <div>
          <h2 id="localModelTitle" class="local-model-title">Gemma 4 E2B <span aria-hidden="true">·</span> Ollama</h2>
          <p class="local-model-meta">Local service on this Mac</p>
        </div>
        <span id="localModelStatusBadge" class="status-badge" aria-live="polite">Checking…</span>
      </div>
      <p class="hint local-model-resource-hint">Post text and filter phrases stay on this Mac, using your local Ollama service.</p>
      <p class="hint local-model-no-image-warning"><strong>Text only.</strong> Posts with images or videos are judged using their written text.</p>
      <p id="nativeStatusText" class="hint" aria-live="polite">Checking the local service…</p>
      <div class="local-model-actions">
        <button id="connectNativeModel" class="local-model-connect-btn" hidden>Connect to Ollama</button>
        <button id="retryNativeModel" class="local-model-retry-btn" hidden>Retry</button>
        <button id="recoverNativeModel" class="local-model-retry-btn" hidden>Resume after restarting Ollama</button>
      </div>
      <details id="nativeSetupHelp" class="local-model-setup-help" hidden>
        <summary>Setup help</summary>
        <p id="nativeSetupHelpText" class="hint"></p>
      </details>
      <p id="localModelActionError" class="local-model-action-error" role="alert" hidden></p>
    </section>

    <section>
      <div class="filter-replies-toggle">
        <label class="checkbox-label">
          <input type="checkbox" id="enableFilterReplies" checked>
          <span>Filter replies in conversations</span>
        </label>
      </div>
    </section>
  </div>

  <script src="dist/popup.js" type="module"></script>
</body>
</html>
